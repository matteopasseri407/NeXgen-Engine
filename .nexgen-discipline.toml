# NeXgen's CRITICAL code: where a mistake loses a user's data, opens a security hole, breaks updating or
# switches the gate off. A commit touching one of these files carries a test in the same commit (`review_paths`).
# The names end in `*` on purpose: when a big critical file is split, the new pieces keep its prefix and stay
# covered (a split into a differently named file is the loophole to avoid). Changing this file always needs a
# decision.
complexity_threshold = 4  # only the size of a change `discipline.py review` puts in the brief; no gate reads it
smoke_command = "python 03-INFRA/scripts/smoke.py"
review_paths = [
  "03-INFRA/scripts/nexgen_core/git_ops*",
  "03-INFRA/scripts/nexgen_core/guard*",
  "03-INFRA/scripts/nexgen_core/updater*",
  "03-INFRA/scripts/nexgen_core/thirdparty_guard*",
  "03-INFRA/scripts/nexgen_core/release*",
  "03-INFRA/scripts/nexgen_core/lock*",
  "03-INFRA/scripts/nexgen_core/files*",
  "03-INFRA/scripts/nexgen_core/discipline*",
  "03-INFRA/scripts/discipline.py",
  "03-INFRA/scripts/check_engine.py",
  "03-INFRA/scripts/nexgen_local/proposals*",
  "03-INFRA/agent-universal-layer/council/proposal*",
  "03-INFRA/agent-universal-layer/trust/*",
  "03-INFRA/agent-universal-layer/leak-scan/*",
  "install.sh",
  "install.ps1",
]
# Translation tables grow with every new message; they are data, not logic.
exclude = ["*/locales/*"]

# Test files the owner allowed to shrink, because the behaviour they asserted no
# longer exists. 2026-11-01: the engine stopped creating a preset team, so the
# assertions about `capo`, `automazioni` and `sviluppo` in these three files were
# replaced by one exact-set assertion per test (`list(entries) == ["main"]`),
# which is stronger than the lines it replaced: it fails on an agent nobody
# declared, including an old one reappearing. They leave this list when the
# files next grow.
test_removal_ok = [
  "03-INFRA/agent-universal-layer/tests/test_nexgen_openclaw_profile.py",
  "03-INFRA/agent-universal-layer/tests/test_nexgen_openclaw_plan.py",
  "03-INFRA/agent-universal-layer/tests/test_nexgen_openclaw_supervisor_tools.py",
]
