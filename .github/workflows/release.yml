# Publish a GitHub release when a signed tag lands.
#
# Why this shape: this workflow used to create the tag itself, on the runner,
# as github-actions[bot]. A runner has no signing key, so every release from
# v0.93.0 to v0.97.6 -- twelve consecutively -- shipped an unsigned tag while
# SECURITY.md promised every tag past v0.3.0 carries a verifiable signature and
# called an unsigned one "a process bug, not a style choice". Nothing caught it
# because `gh release create --verify-tag` checks that the tag exists, not that
# it is signed.
#
# The tag is now cut on the maintainer's machine, where the signing key lives
# and never leaves it. This workflow only publishes, and it refuses a tag that
# carries no signature, so the claim in SECURITY.md is enforced rather than
# asserted.
#
# The automation being replaced existed for a real reason: a manual release
# step is the step that gets skipped, and on 2026-07-30 main sat five merged
# commits past the newest tag, which meant they reached no machine at all. The
# update path compares the newest TAG with the installed VERSION, so unreleased
# work is invisible even to the doctor. That risk moves to the release-pending
# job in ci.yml, which surfaces the gap on main as soon as it opens instead of
# closing it silently and unsigned.
#
# Cutting a release is now one command:
#   git tag -s vX.Y.Z -m "Release vX.Y.Z" && git push origin vX.Y.Z
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not annotated and signed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kind="$(git cat-file -t "$TAG")"
          if [ "$kind" != "tag" ]; then
            echo "::error::$TAG is a $kind, not an annotated tag object. Release tags are created with 'git tag -s'." >&2
            exit 1
          fi
          # Presence is checked, not cryptographic validity: the public key is
          # deliberately absent from the runner. Presence is what closes the
          # regression this workflow shipped for twelve releases, and real
          # verification stays where the key is, in `git verify-tag` on a
          # maintainer or auditor machine.
          if ! git cat-file tag "$TAG" | grep -q -e "BEGIN PGP SIGNATURE" -e "BEGIN SSH SIGNATURE"; then
            echo "::error::$TAG carries no signature. SECURITY.md requires every release tag past v0.3.0 to be signed." >&2
            exit 1
          fi
          echo "$TAG is an annotated, signed tag."

      - name: Check VERSION agrees with the tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          # La regola vive in Python, dove è ancorata e ha i suoi test. Il
          # glob che stava qui accettava "1.2.3abc" come se fosse una versione.
          if ! python3 03-INFRA/scripts/nexgen_core/release.py check-version "$version" "$TAG"; then
            echo "::error::VERSION e il tag non concordano." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        run: |
          python3 - "${{ steps.check.outputs.version }}" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything from this version's heading up to the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          body = (match.group(1).strip() if match else "")
          if not body:
              # Not fatal: a release with no notes is worse than a release that
              # is late, but silently shipping an empty body is worse than both.
              body = (
                  f"No changelog section found for {version}. "
                  "See the commit history for this tag."
              )
              print(f"::warning::CHANGELOG.md has no populated section for {version}")
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          print(body[:400])
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "NeXgen Engine v$VERSION Beta" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
