# Findings that are already in the published history, pinned one by one.
#
# A commit-range scan re-reads every commit since the last release, so a value
# that landed in a commit already on GitHub blocks every later release while no
# longer being preventable. Each entry below matches ONE finding only: the exact
# commit (rev), file, line, pattern and redacted value. The same value in any other
# commit, file or line still blocks, and a reordered pattern file stops matching
# (fail-closed). Add an entry only for a commit that is already public, with the
# reason; never for a new commit, which must be fixed before it is pushed.
