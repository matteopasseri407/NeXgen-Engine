# squad.example.yaml — Squad as data for NeXgen Engine & OpenClaw
#
# Copy this file to your Vault as `squad.yaml` (e.g. at the root or under
# 03-INFRA/agent-universal-layer/squad.yaml) to declare your squad structure.
# When present, squad.yaml takes precedence over defaults during setup.

# The agent a request uses when no binding names one, written to
# agents.defaults.systemAgent.agentId. With more than one explicit agent,
# OpenClaw refuses the main session, Talk and the dreaming cron job without it.
default: "main"

# Optional instructions shared by every agent, appended to the role text and
# deposited as AGENTS.md in each workspace. The path is relative to this file.
# common_md: "squad/common.md"

agents:
  main:
    name: "assistente"
    model: "anthropic/claude-opus-5-5"
    role: "Frontline assistant and entrypoint for conversations"
    # This agent's own instructions, deposited as its workspace AGENTS.md.
    # agents_md: "squad/main.md"
    # Who this agent answers to. Omit it and the roster decides: `main` reports
    # to nobody (it faces the person), `capo` reports to `main`, and every other
    # agent reports to `capo` when there is one, otherwise to `main`. Each
    # manual names the lead, the agents reporting to it and its peers.
    # reportsTo: "main"
    tools:
      # Optional narrowing: the engine writes no global `agentToAgent.allow`,
      # because OpenClaw reads an omitted list as every pair allowed. A `send`
      # here restricts this agent alone; leave it out and it talks to everyone.
      agentToAgent:
        send: ["capo", "sviluppo"]

  capo:
    name: "capo"
    model: "anthropic/claude-opus-5-5"
    role: "Strategic lead, deep planning, and review"
    thinkingDefault: "high"
    reportsTo: "main"
    # Opt-in consumption levers, both off unless you write them. On the `claude-cli`
    # road every model call carries the gateway's whole tool catalogue and, without a
    # cap, may grow to the model's native window: the measured `capo` turn was 74 calls
    # of about 78,000 tokens, about 5.77 M per turn (docs/proposals/daru-burn.md).
    #
    # `lean` publishes a minimal tool surface on this agent's model instead: about
    # 63,000 tokens per call and 4.66 M per turn, -19%, with connectors still reachable
    # through the lazy-mcp gateway. Recommended value: "lean".
    # tool_surface: "lean"
    #
    # A per-call context cap, in tokens. It bounds the worst case (14.8 M per turn
    # instead of 74 M) and makes an older conversation a summary sooner. Recommended
    # value: 200000. Experimental: it writes a `models` array for a provider a bundled
    # plugin owns, so verify one real turn after enabling it (docs/squad.md).
    # context_tokens: 200000
    # agents_md: "squad/capo.md"
    # The agent's execution policy, written to agents.entries.<id>.tools.exec.
    #
    # An agent run through OpenClaw's `claude-cli` backend needs
    # security: "full" and ask: "off": with an allowlist and ask: "on-miss",
    # every one of Claude's own tools (ToolSearch included) and every external
    # MCP tool needs a human approval, and is denied when nobody answers.
    # The engine's guardrail plugin still checks every command before it runs,
    # so `full` is not an unguarded machine.
    #
    # exec:
    #   security: "full"
    #   ask: "off"
    soul: |
      # Capo — Guida strategica e supervisione
      Valuta architettura, rischi e correttezza prima dell'azione.
      Non saltare passaggi di verifica. Risposte ponderate ed essenziali.

  sviluppo:
    name: "sviluppo"
    model: "opencode-go/deepseek-v4.1-flash"
    role: "Code execution and development tasks"
    reportsTo: "capo"
    # Which lane runs this agent's turn. Omitted, it keeps the lane it has today:
    # OpenClaw itself calls the model API above. Set it to claude, codex or
    # opencode and the real CLI runs instead, as its own agent, in this agent's
    # workspace, on its own login: the turn then carries the harness's own prompt
    # and skills instead of OpenClaw's, which is the whole difference in cost.
    #
    # Opt-in, and it needs a conversation bound to that agent: add a `bindings`
    # entry below naming it, or the setup writes neither half (a runtime block
    # with no bound session answers a chat with the default model instead).
    # `agy` is accepted here and stays a CLI backend, never an ACP session.
    # harness: "opencode"
    tools:
      exec:
        host: "node"
        node: "node-pc"
      # A narrowing of this agent only; without it, it may message every agent.
      agentToAgent:
        send: ["capo"]

  # An agent that is the remote control of one machine. Its shell runs on that
  # PC, so the local CLIs and their subscriptions are what does the work, and it
  # receives a manual of its own: report what runs there, open supervised work
  # with `nexgen-local sup`, enter a CLI that is already open, and say so when
  # the machine is off. The name is the one `openclaw nodes list` shows, and the
  # key is shorthand for the `tools.exec` block above. The model is yours to
  # choose: this is the agent whose judgement you rely on from the phone.
  # windows:
  #   name: "windows"
  #   model: "anthropic/claude-opus-5-5"
  #   reportsTo: "main"
  #   node: "MatteoPC"
  #   # The lane, as on `sviluppo`: omitted, OpenClaw calls the model itself.
  #   # harness: "claude"

# The proactive check OpenClaw provisions, and what it costs. In the pinned release a
# heartbeat is an ordinary automation job: every 30 minutes, in the agent's main
# conversation, over whatever that conversation has grown to. That is 48 model calls a
# day, and at the 78,717 tokens one `claude-cli` call was measured at it is about 3.8 M
# tokens a day for a bot nobody may be talking to (docs/proposals/daru-burn.md).
#
# `nexgen openclaw setup` converges the job to this block. Omitting the block keeps the
# default, which is `light`. The three modes, all of them keeping the check and its
# delivery:
#
#   off     the job is switched off (`openclaw automations disable <id>`); nothing runs
#   light   the default: every 6h, in an isolated session, without the bootstrap files
#           and without tools, on the utility model, so a run costs a few thousand
#           tokens instead of a whole conversation
#   full    the job stays as OpenClaw provisioned it, every 30 minutes in the agent's
#           main conversation; `every` and `model` are applied when this block names them
#
# heartbeat:
#   mode: light                    # light (the default) | full | off
#   every: 6h                      # optional: light and full
#   model: "ollama/qwen3:8b"       # optional: light and full, defaults to the utility model

models:
  # Optional model overrides or provider configurations
  anthropic/claude-opus-5-5:
    agentRuntime:
      id: "claude-cli"

bindings:
  # Channel bindings: which agent answers on which communication channel
  - match:
      channel: "telegram"
    agentId: "main"

# Opt-in, and off when omitted: refuse a turn bound to an ACP lane whose plan is
# already spent, instead of starting a harness turn that fails mid-loop. The plugin
# reads the readings the hourly beat writes, so it costs no model call, and it
# answers one line naming the plan and the window. Recommended value: true, once an
# agent above declares `harness:`.
# acp_admission: true
