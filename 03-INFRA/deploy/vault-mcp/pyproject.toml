[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-mcp-server"
version = "0.1.0"
description = "Read-only remote MCP server for Markdown vaults"
readme = "README.md"
# Not an SPDX/OSI identifier (PolyForm Noncommercial 1.0.0 isn't in that
# list), so declared by file rather than by name. The project's license
# requires the notice to travel with every copy -- see the `LICENSE`
# COPY in this directory's Dockerfile for why a copy of the file lives
# here too, next to this pyproject.toml, instead of only at the repo root.
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
  # MCP SDK 2.x implements the 2026-07-28 protocol revision and keeps serving
  # every earlier revision from the same server, so bumping here does not cut
  # off clients that still speak 2025-11-25 or older.
  "mcp>=2.0.0,<3.0.0",
  "starlette>=0.37.2,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
vault-mcp-server = "vault_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
