# Rizzo PII 2.0.0 sidecar (build ARM verificata il 2026-10-11).
#
# L'immagine NON e vendored: si compila dal repo upstream al tag pinnato
# (vedi build-pii.sh) e il modello entra nell'immagine in fase di build.
# A runtime il container non esce su internet (HF_HUB_OFFLINE=1).
# Upstream: https://github.com/Rizzo-AI-Academy/rizzo-pii (MIT).
# Modello: https://huggingface.co/rizzoaiacademy/rizzo-pii-0.3B
#
# Rollback: prima di ricostruire, `docker tag rizzo-pii:2.0.0 rizzo-pii:2.0.0-prev`;
# per tornare indietro: `PII_IMAGE=rizzo-pii:2.0.0-prev docker compose up -d --no-build`.
# Questo servizio non indicizza nulla: nessun volume dati da salvare, solo
# preferenze UI in pii-home (ricreabile).

services:
  rizzo-pii:
    build: ./upstream
    image: ${PII_IMAGE:-rizzo-pii:2.0.0}
    container_name: rizzo-pii
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      PII_HOST: "0.0.0.0"
      PII_PORT: "5005"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    cpus: "1.5"
    mem_limit: 2.5g
    volumes:
      - pii-home:/home/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  pii-home:
